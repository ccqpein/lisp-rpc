[package]
name = "benches"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
lisp-rpc-rust-parser = { workspace = true }
lisp-rpc-rust-raw-data = { workspace = true }
lisp-rpc-rust-serializer = { workspace = true }
serde = { version = "1", features = ["derive"] }
futures-core = "0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench0"
path = "bench0.rs"
harness = false

[[bench]]
name = "bench1"
path = "bench1.rs"
harness = false
