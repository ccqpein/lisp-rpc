[workspace]
resolver = "3"
members = [
  "parsers/lisp-rpc-rust-parser",
  "generators/lisp-rpc-rust-generator",
  "generators/lisp-rpc-rust-generator-macro",
  "serializer",
  "server",

  "examples/rust/plain-mode-read-and-write-data",
  "examples/rust/serialize-struct-to-lisprpc",
  "examples/rust/server-with-custom-structure",
]

[profile.dev]
opt-level = 0
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
lisp-rpc-rust-parser = { version = "0.1.0", path = "parsers/lisp-rpc-rust-parser" }
lisp-rpc-rust-generator = { version = "0.1.0", path = "generators/lisp-rpc-rust-generator" }
lisp-rpc-rust-generator-macro = { version = "0.1.0", path = "generators/lisp-rpc-rust-generator-macro" }
lisp-rpc-rust-serializer = { version = "0.1.0", path = "serializer" }
lisp-rpc-rust-server = { version = "0.1.0", path = "server" }
