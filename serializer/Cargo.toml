[package]
name = "lisp-rpc-rust-serializer"
version = "0.1.5"
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lisp-rpc-rust-serializer"
readme = "README.md"
keywords = ["lisp", "rpc", "serde", "s-expression", "serializer"]
categories = ["encoding", "parsing"]
description = "Serialization and deserialization logic for Lisp-RPC, a lightweight, S-expression-based Remote Procedure Call protocol."

[dependencies]
serde = { version = "1", features = ["derive"] }
convert_case = "0"
anyhow = "1"
